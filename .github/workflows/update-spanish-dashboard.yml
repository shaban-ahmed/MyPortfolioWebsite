
name: Update Spanish Learning Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Fetch Spanish learning data
        working-directory: spanish-learning-analytics
        env:
          LRS_ENDPOINT: ${{ secrets.LRS_ENDPOINT }}
          LRS_KEY: ${{ secrets.LRS_KEY }}
          LRS_SECRET: ${{ secrets.LRS_SECRET }}
          LEARNER_EMAIL: ${{ secrets.LEARNER_EMAIL }}
        run: python3 scripts/sync.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spanish-learning-analytics/data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update Spanish learning dashboard data"
            git push
          fi
